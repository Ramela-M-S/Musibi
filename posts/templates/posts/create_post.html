{% extends "feed/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Share a Post | Musibi{% endblock %}

{% block content %}
<style>
    .create-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 15px;
    }

    .create-card {
        width: 100%;
        max-width: 600px;
        background: #ffffff;
        border-radius: 18px;
        padding: 32px 28px;
        border: 1px solid #E2E8F0;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
    }

    .create-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .create-header h2 {
        font-weight: 800;
        color: #0F172A;
        font-size: 1.55rem;
        margin-bottom: 4px;
    }

    .create-header p {
        color: #64748B;
        font-size: 0.9rem;
    }

    .post-btn {
        width: 100%;
        padding: 11px;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 8px;
        background: #D92338 !important;
        color: #ffffff !important;
        border: none !important;
        transition: background 0.15s ease;
        margin-top: 12px;
    }

    .post-btn:hover {
        background: #B3172A !important;
    }
</style>

<div class="create-wrapper">
    <div class="create-card">
        <div class="create-header">
            <h2>Share with your campus</h2>
            <p>Upload lecture notes, post a hackathon update, or ask a question</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary post-btn">
                Post to Feed
            </button>
        </form>
    </div>
</div>
{% endblock %}
